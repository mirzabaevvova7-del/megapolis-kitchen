name: Publish MEGAPOLIS MEBEL Sandiq App

on:
  push:
    branches:
      - megapolis-sandiq-app
    paths:
      - "sandiq-app/**"
      - ".github/workflows/deploy-sandiq.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-sandiq"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: sandiq-app

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
