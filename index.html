
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGAPOLIS — 3D Furniture Designer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:#fff;font-family:Arial,sans-serif}
header{padding:15px 18px;background:#080d18;border-bottom:1px solid #30394a}
header h2{margin:0;color:#e6b85c;font-size:20px}
header small{color:#aab3c2}
.app{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 65px)}
.panel{padding:16px;background:#151e2d;overflow:auto}
h3{font-size:15px;color:#e6b85c;margin:8px 0 14px}
label{display:block;font-size:12px;color:#c1c9d6;margin:12px 0 5px}
input,select,button{width:100%;padding:11px;border-radius:7px;border:1px solid #46536a;background:#202c40;color:white}
button{background:#c18d36;border:0;color:#111827;font-weight:bold;margin-top:10px;cursor:pointer}
button.secondary{background:#34445d;color:white}
button.danger{background:#9e3c3c;color:white}
.viewer{min-height:600px;position:relative;background:#202b3c}
#scene{width:100%;height:100%;min-height:600px;display:block}
.hint{position:absolute;bottom:12px;left:12px;background:#111c2dcc;padding:10px;border-radius:8px;font-size:12px;color:#d5dce8}
.module{padding:10px;background:#26344a;border-radius:8px;margin:7px 0;cursor:pointer}
.module.active{outline:2px solid #e6b85c}
.stats{font-size:12px;color:#bdc7d5;line-height:1.8}
@media(max-width:750px){
.app{grid-template-columns:1fr}
.panel{order:2}
.viewer{order:1;min-height:430px}
#scene{min-height:430px}
}
</style>
</head>
<body>
<header>
<h2>MEGAPOLIS KOMPANIYASI</h2>
<small>Professional 3D Furniture Designer</small>
</header>

<div class="app">
<aside class="panel">
<h3>МЕБЕЛЬ КОНСТРУКТОРИ</h3>

<label>Мебель тури</label>
<select id="type">
<option value="base">Пастки шкаф</option>
<option value="wall">Юқори шкаф</option>
<option value="tall">Пенал шкаф</option>
<option value="drawer">Тумба / яшикли шкаф</option>
</select>
<button id="add">+ Модул қўшиш</button>

<h3 style="margin-top:24px">Модул ўлчамлари (мм)</h3>
<label>Эни</label>
<input id="width" type="number" value="600" min="100">
<label>Баландлиги</label>
<input id="height" type="number" value="720" min="100">
<label>Чуқурлиги</label>
<input id="depth" type="number" value="560" min="100">
<button id="apply">Ўлчамни қўллаш</button>

<h3 style="margin-top:24px">Материал ва ранг</h3>
<label>Фасад ранги</label>
<select id="color">
<option value="#eeeeeb">Оқ</option>
<option value="#777b80">Кулранг</option>
<option value="#24272d">Қора</option>
<option value="#b78a58">Ёғоч ранги</option>
<option value="#d8c5a5">Беж</option>
<option value="#263d55">Кўк</option>
</select>
<label>Корпус материали</label>
<select id="bodyColor">
<option value="#b9b6ae">Оқ LDSP</option>
<option value="#777b80">Кулранг LDSP</option>
<option value="#302c29">Қора LDSP</option>
<option value="#98734d">Ёғоч LDSP</option>
</select>
<button id="material">Материални қўллаш</button>

<h3 style="margin-top:24px">Модуллар рўйхати</h3>
<div id="modules"></div>
<button class="danger" id="remove">Танланган модулни ўчириш</button>
<button class="secondary" id="reset">Лойиҳани тозалаш</button>

<h3 style="margin-top:24px">Лойиҳа маълумоти</h3>
<div class="stats" id="stats">Модуллар: 0</div>
</aside>

<main class="viewer">
<canvas id="scene"></canvas>
<div class="hint">3D кўриниш: бармоқ билан айлантиринг, икки бармоқ билан яқинлаштиринг.</div>
</main>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#202b3c');

const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
camera.position.set(5,4,7);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(1,1,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x536070,2));
const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(4,8,5);
light.castShadow=true;
scene.add(light);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(30,30),
 new THREE.MeshStandardMaterial({color:'#aab0b8',roughness:0.9})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.02;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(20,40,0x64748b,0x46536a);
scene.add(grid);

let items=[];
let selected=null;
let nextId=1;

function makeCabinet(type,w,h,d,facade,body){
 const group=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({color:body,roughness:0.8});
 const frontMat=new THREE.MeshStandardMaterial({color:facade,roughness:0.35});
 function box(x,y,z,sx,sy,sz,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  m.position.set(x,y,z);
  m.castShadow=true;m.receiveShadow=true;
  group.add(m);return m;
 }
 // Корпус
 box(0,h/2,0,w-0.025,h-0.025,d-0.025,bodyMat);
 // Олд фасад панели
 const frontZ=d/2+0.012;
 box(0,h/2,frontZ,w-0.035,h-0.035,0.035,frontMat);
 // Фасадга вертикал ажратгич чизиғи
 if(type==='drawer'){
  for(let i=1;i<3;i++){
   const line=box(0,h*i/3,frontZ+0.021,w-0.08,0.008,0.008,
    new THREE.MeshStandardMaterial({color:'#777777'}));
  }
 }
 // Ручка
 const handleMat=new THREE.MeshStandardMaterial({color:'#b99a61',metalness:0.8,roughness:0.25});
 const handle=box(w*0.25,h*0.52,frontZ+0.045,0.12,0.025,0.025,handleMat);
 if(type==='wall'){
  // Юқори шкаф учун икки эшик
  handle.position.x=w*0.25;
 }
 group.userData={type,w,h,d,facade,body};
 return group;
}

function addCabinet(){
 const type=document.querySelector('#type').value;
 const w=Number(document.querySelector('#width').value)/1000;
 const h=Number(document.querySelector('#height').value)/1000;
 const d=Number(document.querySelector('#depth').value)/1000;
 const facade=document.querySelector('#color').value;
 const body=document.querySelector('#bodyColor').value;
 if(w<=0||h<=0||d<=0)return alert('Ўлчамларни текширинг');
 const obj=makeCabinet(type,w,h,d,facade,body);
 obj.position.set(items.reduce((sum,x)=>sum+x.userData.w,0)+w/2,0,0);
 obj.userData.id=nextId++;
 scene.add(obj);
 items.push(obj);
 select(obj);
 update();
}

function select(obj){
 selected=obj;
 items.forEach(x=>{
  x.traverse(o=>{
   if(o.isMesh)o.material.emissive=new THREE.Color(x===obj?0x292010:0x000000);
  });
 });
 updateList();
 if(obj){
  document.querySelector('#width').value=Math.round(obj.userData.w*1000);
  document.querySelector('#height').value=Math.round(obj.userData.h*1000);
  document.querySelector('#depth').value=Math.round(obj.userData.d*1000);
  document.querySelector('#color').value=obj.userData.facade;
  document.querySelector('#bodyColor').value=obj.userData.body;
 }
}

function rebuild(){
 if(!selected)return;
 const old=selected;
 const p=old.position.clone();
 const r=old.rotation.clone();
 const w=Number(document.querySelector('#width').value)/1000;
 const h=Number(document.querySelector('#height').value)/1000;
 const d=Number(document.querySelector('#depth').value)/1000;
 if(w<=0||h<=0||d<=0)return alert('Ўлчам нотўғри');
 const obj=makeCabinet(old.userData.type,w,h,d,
  document.querySelector('#color').value,
  document.querySelector('#bodyColor').value);
 obj.userData.id=old.userData.id;
 obj.position.copy(p);obj.rotation.copy(r);
 scene.remove(old);
 scene.add(obj);
 items[items.indexOf(old)]=obj;
 select(obj);
 update();
}

function updateList(){
 const el=document.querySelector('#modules');
 el.innerHTML='';
 items.forEach((obj,i)=>{
  const div=document.createElement('div');
  div.className='module'+(obj===selected?' active':'');
  div.textContent=`Модул ${i+1} — ${Math.round(obj.userData.w*1000)} мм`;
  div.onclick=()=>select(obj);
  el.appendChild(div);
 });
}

function update(){
 updateList();
 document.querySelector('#stats').textContent=
 `Модуллар: ${items.length} | Умумий кенглик: ${Math.round(items.reduce((s,x)=>s+x.userData.w,0)*1000)} мм`;
}

document.querySelector('#add').onclick=addCabinet;
document.querySelector('#apply').onclick=rebuild;
document.querySelector('#material').onclick=rebuild;
document.querySelector('#remove').onclick=()=>{
 if(!selected)return;
 scene.remove(selected);
 items=items.filter(x=>x!==selected);
 selected=null;update();
};
document.querySelector('#reset').onclick=()=>{
 items.forEach(x=>scene.remove(x));
 items=[];selected=null;update();
};

function resize(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 camera.aspect=w/h;camera.updateProjectionMatrix();
 renderer.setSize(w,h,false);
}
new ResizeObserver(resize).observe(canvas.parentElement);
resize();

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();
addCabinet();
</script>
</body>
</html>
